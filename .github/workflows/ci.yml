name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Unit tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  # ── Shared setup for all e2e jobs ──────────────────────────────────────────
  # Each e2e job starts its own registry:2 — GHA service containers are
  # scoped per-job and registry state is ephemeral, which is what we want.

  # ── E2E: docker + local registry ───────────────────────────────────────────
  e2e-docker-local:
    name: E2E — docker + local registry
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run e2e test
        env:
          METAFLOW_TEST_REGISTRY_HOST: localhost:5000
        run: pytest tests/e2e/test_e2e_docker_local.py -v --tb=short

  # ── E2E: buildx + local registry ───────────────────────────────────────────
  #
  # GHA service containers don't bind into the host network namespace, so the
  # BuildKit daemon container (docker-container driver) cannot reach them even
  # with --driver-opt network=host.  The workaround is to start the registry
  # manually with --network=host so it binds directly to the runner's loopback.
  e2e-buildx-local:
    name: E2E — buildx + local registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Configure insecure registry + start registry on host network
        run: |
          # Configure insecure registry and restart Docker first.
          echo '{"insecure-registries": ["localhost:5000"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          until docker info >/dev/null 2>&1; do sleep 1; done
          # Start registry AFTER daemon restart so it isn't killed.
          # --network=host ensures the BuildKit container (also network=host) can reach it.
          docker run -d --network=host registry:2
          sleep 2
      - name: Set up buildx builder
        run: |
          docker buildx create --name local-builder --use --driver-opt network=host
          docker buildx inspect --bootstrap
      - name: Run e2e test
        env:
          METAFLOW_TEST_REGISTRY_HOST: localhost:5000
        run: pytest tests/e2e/test_e2e_buildx_local.py -v --tb=short

  # ── E2E: kaniko + local registry ───────────────────────────────────────────
  e2e-kaniko-local:
    name: E2E — kaniko + local registry
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Pull kaniko executor image
        run: docker pull gcr.io/kaniko-project/executor:latest
      - name: Run e2e test
        env:
          METAFLOW_TEST_REGISTRY_HOST: localhost:5000
          # kaniko runs with --network=host so localhost:5000 reaches the registry service
        run: pytest tests/e2e/test_e2e_kaniko_local.py -v --tb=short

  # ── E2E: docker + GCR (faked via registry:2) ───────────────────────────────
  e2e-gcr-fake:
    name: E2E — docker + GCR (registry:2 substitute)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run e2e test
        env:
          METAFLOW_TEST_REGISTRY_HOST: localhost:5000
          # GCRRegistry reads METAFLOW_PREBUILT_GCR_HOST; set by conftest via env
        run: pytest tests/e2e/test_e2e_gcr_fake.py -v --tb=short
